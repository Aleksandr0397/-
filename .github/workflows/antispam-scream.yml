name: Build AntiSpamScream APK

on:
  push:
    branches: [antispam-scream]
    paths:
      - 'AntiSpamScream/**'
      - '.github/workflows/antispam-scream.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools, platforms;android-35, build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: AntiSpamScream
        run: gradle :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AntiSpamScream-debug
          path: AntiSpamScream/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
